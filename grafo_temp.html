                  var container = document.getElementById('mynetwork');

                  nodes = new vis.DataSet([{"color": "#ff2e63", "font": {"color": "white"}, "id": "A", "label": "A", "shape": "dot", "size": 28}, {"color": "#ff2e63", "font": {"color": "white"}, "id": "B", "label": "B", "shape": "dot", "size": 28}, {"color": "#ff2e63", "font": {"color": "white"}, "id": "C", "label": "C", "shape": "dot", "size": 28}, {"color": "#ff2e63", "font": {"color": "white"}, "id": "D", "label": "D", "shape": "dot", "size": 28}, {"color": "#ff2e63", "font": {"color": "white"}, "id": "E", "label": "E", "shape": "dot", "size": 28}, {"color": "#ff2e63", "font": {"color": "white"}, "id": "F", "label": "F", "shape": "dot", "size": 28}]);
